name: 刷新 v2.16.3-beta.1 发布附件

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-v2.16.3-beta.1
  cancel-in-progress: false

env:
  RELEASE_TAG: v2.16.3-beta.1
  DOTNET_NOLOGO: true

jobs:
  build:
    name: 构建 ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: 验证 Windows 回归测试
        if: matrix.rid == 'win-x64'
        shell: bash
        run: dotnet test MFAAvalonia.Tests/MFAAvalonia.Tests.csproj -c Release --logger 'trx;LogFileName=release-update.trx' --results-directory test-results
      - name: 保存回归测试结果
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: release-tests
          path: test-results/*.trx
      - name: 发布程序
        shell: bash
        run: dotnet publish MFAAvalonia.Desktop/MFAAvalonia.Desktop.csproj -c Release -r '${{ matrix.rid }}' -p:Platform=AnyCPU --output "$GITHUB_WORKSPACE/publish"
      - name: 验证发布目录与程序集版本
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'publish'
          $extension = if ('${{ matrix.rid }}'.StartsWith('win')) { '.exe' } else { '' }
          if (-not (Test-Path -LiteralPath (Join-Path $root "MaaPazugiri$extension"))) {
            throw '发布目录缺少主程序。'
          }
          $core = @(Get-ChildItem -LiteralPath $root -Recurse -Filter 'MFAAvalonia.Core.dll')
          if ($core.Count -ne 1) { throw '核心程序集缺失或重复。' }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($core[0].FullName)
          if ($version.ProductVersion -notlike '2.16.3-beta.1*') {
            throw "核心程序集版本不符：$($version.ProductVersion)"
          }
          $framework = @(Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object { $_.Name -match '^(lib)?MaaFramework\.(dll|so|dylib)$' })
          if ($framework.Count -eq 0) { throw '发布目录缺少 MaaFramework 原生库。' }
          Get-ChildItem -LiteralPath $root -Recurse -Filter '*.pdb' | Remove-Item
          Get-ChildItem -LiteralPath $root -Recurse -Filter 'SukiUI.xml' | Remove-Item
          @{ version = $env:RELEASE_TAG; commit = $env:GITHUB_SHA; platform = '${{ matrix.rid }}'; workflow = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'build-info.json') -Encoding utf8NoBOM
          Write-Host "已验证主程序、MaaFramework 原生库及版本 $($version.ProductVersion)"
      - name: 设置 Unix 执行权限
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x publish/MaaPazugiri
          find publish -type f \( -name '*.sh' -o -name 'MFAUpdater*' -o -name 'MaaAgentBinary' -o -name 'MaaPiCli' \) -exec chmod +x {} \;
      - name: 签名并验证 macOS 程序
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find publish -type f -print0 | while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              codesign -s - --force "$candidate"
              codesign --verify --strict "$candidate"
            fi
          done
      - name: 打包 Windows 附件
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts | Out-Null
          Compress-Archive -Path publish/* -DestinationPath "artifacts/MFAAvalonia-$env:RELEASE_TAG-${{ matrix.rid }}.zip" -CompressionLevel Optimal
      - name: 打包 Unix 附件
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czpf "artifacts/MFAAvalonia-$RELEASE_TAG-${{ matrix.rid }}.tar.gz" -C publish .
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: 更新现有 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: artifacts
      - name: 校验六个平台包并生成源码快照
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            if [[ "$rid" == win-* ]]; then
              unzip -t "artifacts/MFAAvalonia-$RELEASE_TAG-$rid.zip" > /dev/null
            else
              tar -tzf "artifacts/MFAAvalonia-$RELEASE_TAG-$rid.tar.gz" > /dev/null
              tar -tvzf "artifacts/MFAAvalonia-$RELEASE_TAG-$rid.tar.gz" | grep -E '^-rwx.* ./MaaPazugiri$'
            fi
          done
          git archive --format=tar.gz --prefix="MFAA-$RELEASE_TAG-refresh/" -o "artifacts/MFAA-$RELEASE_TAG-source-refresh.tar.gz" HEAD
          (cd artifacts && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
          cat SHA256SUMS.txt 2>/dev/null || cat artifacts/SHA256SUMS.txt
      - name: 保存远端更新前记录
        shell: bash
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,body,assets,isDraft,isPrerelease > release-before.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-before-update
          path: release-before.json
      - name: 更新附件与发布说明
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" artifacts/* --clobber
          cp .github/release-notes/v2.16.3-beta.1.md release-notes.md
          printf '\n本次构建源码：[提交 %s](https://github.com/%s/commit/%s)。\n\n构建记录：[六个平台构建](https://github.com/%s/actions/runs/%s)。\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
      - name: 核对远端附件摘要和发布状态
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release-after.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          release = json.loads(Path('release-after.json').read_text())
          assert release['prerelease'] and not release['draft'], '发布状态异常'
          remote = {asset['name']: asset for asset in release['assets']}
          files = list(Path('artifacts').iterdir())
          assert len(files) == 8, '本地附件数量异常'
          for path in files:
              asset = remote[path.name]
              digest = 'sha256:' + hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()
              assert asset['state'] == 'uploaded', path.name
              assert asset['size'] == path.stat().st_size, path.name
              assert asset['digest'] == digest, path.name
              print(f"已核对 {path.name}：{digest}")
          assert '${{ github.sha }}' in release['body'], '发布说明缺少构建提交'
          PY
