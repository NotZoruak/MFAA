# MaaFramework resource project release template / MaaFramework 资源项目发版模板
#
# 中文：资源仓库可将本文件复制到 .github/workflows/install.yml。此发布流程仅打包桌面版。
# English: A resource repository can copy this file to .github/workflows/install.yml. This release flow packages desktop builds only.
#
name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "agent/**"
      - "android/**"
      - "data/**"
      - "locales/**"
      - "python/**"
      - "resource/**"
      - "Resource/**"
      - "tasks/**"
      - "interface.json"
      - "interface.jsonc"
      - "requirements*.txt"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "agent/**"
      - "android/**"
      - "data/**"
      - "locales/**"
      - "python/**"
      - "resource/**"
      - "Resource/**"
      - "tasks/**"
      - "interface.json"
      - "interface.jsonc"
      - "requirements*.txt"
      - "**.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        shell: bash
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" "${{ github.ref }}" || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi
          if ! $is_release; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
          echo "is_release=$is_release" | tee -a "$GITHUB_OUTPUT"
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}

  install-desktop:
    needs: meta
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        os: [win, macos, linux]
        arch: [aarch64, x86_64]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          latest: true
          out-file-path: deps
          extract: true

      - name: Download MFAAvalonia
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: NotZoruak/MFAA
          fileName: "MFAAvalonia-*-${{ (matrix.os == 'win' && 'win') || (matrix.os == 'macos' && 'osx') || 'linux' }}-${{ (matrix.arch == 'x86_64' && 'x64') || 'arm64' }}*"
          latest: true
          out-file-path: MFA
          extract: true

      - name: Clean up MFAAvalonia archive
        shell: bash
        run: |
          archive_file_path="${{ fromJson(steps.download_mfa.outputs.downloaded_files)[0] }}"
          rm -f "$archive_file_path"

      - name: Install desktop package
        shell: bash
        run: |
          python ./install.py "${{ needs.meta.outputs.tag }}"
          if [[ -d MFA ]]; then
            mkdir -p install
            rsync -av --ignore-existing MFA/ install/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MaaXXX-${{ matrix.os }}-${{ matrix.arch }}
          path: install

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install-desktop, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Prepare release files
        shell: bash
        run: |
          cd assets
          for directory in */; do
            directory=${directory%/}
            (cd "$directory" && zip -r "../$directory-${{ needs.meta.outputs.tag }}.zip" .)
            rm -rf "$directory"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: false
